# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/llm/webserver.pid;
error_log /var/log/sdkwork/llm/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name llm-demo.sdkwork.com llm-demo.birdcoder.com llm-demo.dtupay.com llm-demo.noaper.com llm-demo.sdkwork.cn llm-demo.birdcoder.cn llm-demo.dtupay.cn llm-demo.noaper.cn llm-demo.skubc.com llm-demo.skubc.cn llm-demo.zowalk.com llm-demo.zowalk.cn llm-demo.offer86.com llm-demo.offer86.cn llm-demo.86offer.com llm-demo.86offer.cn llm-app-demo.sdkwork.com llm-app-demo.birdcoder.com llm-app-demo.dtupay.com llm-app-demo.noaper.com llm-app-demo.sdkwork.cn llm-app-demo.birdcoder.cn llm-app-demo.dtupay.cn llm-app-demo.noaper.cn llm-app-demo.skubc.com llm-app-demo.skubc.cn llm-app-demo.zowalk.com llm-app-demo.zowalk.cn llm-app-demo.offer86.com llm-app-demo.offer86.cn llm-app-demo.86offer.com llm-app-demo.86offer.cn llm-admin-demo.sdkwork.com llm-admin-demo.birdcoder.com llm-admin-demo.dtupay.com llm-admin-demo.noaper.com llm-admin-demo.sdkwork.cn llm-admin-demo.birdcoder.cn llm-admin-demo.dtupay.cn llm-admin-demo.noaper.cn llm-admin-demo.skubc.com llm-admin-demo.skubc.cn llm-admin-demo.zowalk.com llm-admin-demo.zowalk.cn llm-admin-demo.offer86.com llm-admin-demo.offer86.cn llm-admin-demo.86offer.com llm-admin-demo.86offer.cn llm-open-demo.sdkwork.com llm-open-demo.birdcoder.com llm-open-demo.dtupay.com llm-open-demo.noaper.com llm-open-demo.sdkwork.cn llm-open-demo.birdcoder.cn llm-open-demo.dtupay.cn llm-open-demo.noaper.cn llm-open-demo.skubc.com llm-open-demo.skubc.cn llm-open-demo.zowalk.com llm-open-demo.zowalk.cn llm-open-demo.offer86.com llm-open-demo.offer86.cn llm-open-demo.86offer.com llm-open-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/llm/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
