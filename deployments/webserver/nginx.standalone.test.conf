# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/llm/webserver.pid;
error_log /var/log/sdkwork/llm/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name llm-test.sdkwork.com llm-test.birdcoder.com llm-test.dtupay.com llm-test.noaper.com llm-test.sdkwork.cn llm-test.birdcoder.cn llm-test.dtupay.cn llm-test.noaper.cn llm-test.skubc.com llm-test.skubc.cn llm-test.zowalk.com llm-test.zowalk.cn llm-test.offer86.com llm-test.offer86.cn llm-test.86offer.com llm-test.86offer.cn memory-test.sdkwork.com llm-app-test.sdkwork.com llm-app-test.birdcoder.com llm-app-test.dtupay.com llm-app-test.noaper.com llm-app-test.sdkwork.cn llm-app-test.birdcoder.cn llm-app-test.dtupay.cn llm-app-test.noaper.cn llm-app-test.skubc.com llm-app-test.skubc.cn llm-app-test.zowalk.com llm-app-test.zowalk.cn llm-app-test.offer86.com llm-app-test.offer86.cn llm-app-test.86offer.com llm-app-test.86offer.cn memory-app-test.sdkwork.com llm-admin-test.sdkwork.com llm-admin-test.birdcoder.com llm-admin-test.dtupay.com llm-admin-test.noaper.com llm-admin-test.sdkwork.cn llm-admin-test.birdcoder.cn llm-admin-test.dtupay.cn llm-admin-test.noaper.cn llm-admin-test.skubc.com llm-admin-test.skubc.cn llm-admin-test.zowalk.com llm-admin-test.zowalk.cn llm-admin-test.offer86.com llm-admin-test.offer86.cn llm-admin-test.86offer.com llm-admin-test.86offer.cn memory-admin-test.sdkwork.com llm-open-test.sdkwork.com llm-open-test.birdcoder.com llm-open-test.dtupay.com llm-open-test.noaper.com llm-open-test.sdkwork.cn llm-open-test.birdcoder.cn llm-open-test.dtupay.cn llm-open-test.noaper.cn llm-open-test.skubc.com llm-open-test.skubc.cn llm-open-test.zowalk.com llm-open-test.zowalk.cn llm-open-test.offer86.com llm-open-test.offer86.cn llm-open-test.86offer.com llm-open-test.86offer.cn mem-test.sdkwork.com;
